<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | ApexCart</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="glass-panel p-4 p-md-5">
                <div class="text-center mb-4">
                    <i class="fas fa-key text-warning fa-3x mb-3"></i>
                    <h3 class="fw-bold">Reset Password</h3>
                    <p class="text-secondary small">Enter your email and we'll simulate sending a reset link.</p>
                </div>

                <form th:action="@{/forgot-password}" method="POST">
                    <div class="mb-3">
                        <label for="email" class="form-label text-secondary fw-semibold">Email Address</label>
                        <input type="email" id="email" name="email" class="form-control bg-transparent text-light border-secondary" placeholder="name@example.com" required>
                    </div>

                    <button type="submit" class="btn btn-gradient w-100 py-2 fs-6 fw-bold mt-3">Send Reset Instructions</button>
                </form>

                <p class="text-center text-secondary small mb-0 mt-4">
                    Remember your password? <a href="/login" class="text-primary text-decoration-none fw-semibold">Return to Login</a>
                </p>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
