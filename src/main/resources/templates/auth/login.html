<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | ApexCart</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="glass-panel p-4 p-md-5">
                <div class="text-center mb-4">
                    <i class="fas fa-lock text-primary fa-3x mb-3"></i>
                    <h3 class="fw-bold">Welcome Back</h3>
                    <p class="text-secondary small">Sign in to manage your shopping cart and orders</p>
                </div>

                <div th:replace="~{fragments/alerts :: alerts}"></div>

                <div th:if="${param.error}" class="alert alert-danger glass-card">
                    <i class="fas fa-exclamation-circle me-2"></i> Invalid email or password.
                </div>
                <div th:if="${param.logout}" class="alert alert-info glass-card">
                    <i class="fas fa-info-circle me-2"></i> You have logged out successfully.
                </div>

                <form th:action="@{/login}" method="POST">
                    <div class="mb-3">
                        <label for="email" class="form-label text-secondary fw-semibold">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-transparent border-secondary text-secondary"><i class="fas fa-envelope"></i></span>
                            <input type="email" id="email" name="username" class="form-control bg-transparent text-light border-secondary" placeholder="name@example.com" required autofocus>
                        </div>
                    </div>

                    <div class="mb-3">
                        <div class="d-flex justify-content-between">
                            <label for="password" class="form-label text-secondary fw-semibold">Password</label>
                            <a href="/forgot-password" class="small text-primary text-decoration-none">Forgot Password?</a>
                        </div>
                        <div class="input-group">
                            <span class="input-group-text bg-transparent border-secondary text-secondary"><i class="fas fa-key"></i></span>
                            <input type="password" id="password" name="password" class="form-control bg-transparent text-light border-secondary" placeholder="••••••••" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-gradient w-100 py-2 fs-6 fw-bold mt-3">Sign In <i class="fas fa-sign-in-alt ms-2"></i></button>
                </form>

                <hr class="my-4 border-secondary opacity-25">

                <!-- Quick Demo Credentials Box -->
                <div class="p-3 glass-card rounded-3 mb-4">
                    <h6 class="fw-bold text-warning mb-2"><i class="fas fa-key me-2"></i>Demo Quick Logins</h6>
                    <div class="row g-2 small">
                        <div class="col-6">
                            <strong class="text-light">Customer Account:</strong><br>
                            <span class="text-secondary">john@example.com</span><br>
                            <span class="text-secondary">user123</span>
                        </div>
                        <div class="col-6">
                            <strong class="text-light">Admin Account:</strong><br>
                            <span class="text-secondary">admin@ecommerce.com</span><br>
                            <span class="text-secondary">admin123</span>
                        </div>
                    </div>
                </div>

                <p class="text-center text-secondary small mb-0">
                    Don't have an account? <a href="/register" class="text-primary text-decoration-none fw-semibold">Register here</a>
                </p>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
