<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | NextCart</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="glass-panel p-4 p-md-5">
                <div class="text-center mb-4">
                    <i class="fas fa-user-plus text-primary fa-3x mb-3"></i>
                    <h3 class="fw-bold">Create an Account</h3>
                    <p class="text-secondary small">Join NextCart for personalized recommendations and instant checkout</p>
                </div>

                <div th:replace="~{fragments/alerts :: alerts}"></div>

                <form th:action="@{/register}" th:object="${userRegistrationDto}" method="POST">
                    <div class="mb-3">
                        <label for="fullName" class="form-label text-secondary fw-semibold">Full Name *</label>
                        <input type="text" id="fullName" th:field="*{fullName}" class="form-control bg-transparent text-light border-secondary" placeholder="Jane Doe" required>
                        <small class="text-danger" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></small>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label text-secondary fw-semibold">Email Address *</label>
                        <input type="email" id="email" th:field="*{email}" class="form-control bg-transparent text-light border-secondary" placeholder="jane@example.com" required>
                        <small class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></small>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="password" class="form-label text-secondary fw-semibold">Password *</label>
                            <input type="password" id="password" th:field="*{password}" class="form-control bg-transparent text-light border-secondary" placeholder="â€¢â€¢â€¢â€¢â€¢â€¢â€¢â€¢" required>
                            <small class="text-danger" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></small>
                        </div>
                        <div class="col-md-6">
                            <label for="confirmPassword" class="form-label text-secondary fw-semibold">Confirm Password *</label>
                            <input type="password" id="confirmPassword" th:field="*{confirmPassword}" class="form-control bg-transparent text-light border-secondary" placeholder="â€¢â€¢â€¢â€¢â€¢â€¢â€¢â€¢" required>
                            <small class="text-danger" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></small>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="phone" class="form-label text-secondary fw-semibold">Phone Number</label>
                        <input type="text" id="phone" th:field="*{phone}" class="form-control bg-transparent text-light border-secondary" placeholder="+1 555 019 2831">
                    </div>

                    <div class="mb-3">
                        <label for="address" class="form-label text-secondary fw-semibold">Shipping Address</label>
                        <textarea id="address" th:field="*{address}" class="form-control bg-transparent text-light border-secondary" rows="2" placeholder="Street, City, State, ZIP"></textarea>
                    </div>

                    <button type="submit" class="btn btn-gradient w-100 py-2 fs-6 fw-bold mt-3">Register Account <i class="fas fa-arrow-right ms-2"></i></button>
                </form>

                <p class="text-center text-secondary small mb-0 mt-4">
                    Already registered? <a href="/login" class="text-primary text-decoration-none fw-semibold">Sign in here</a>
                </p>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
