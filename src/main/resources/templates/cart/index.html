<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart | NextCart</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container my-5">
    <h3 class="fw-bold mb-4"><i class="fas fa-shopping-cart text-primary me-2"></i> Shopping Cart</h3>

    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <!-- Empty Cart View -->
    <div th:if="${cart.items.empty}" class="glass-panel text-center p-5 my-4">
        <i class="fas fa-cart-arrow-down text-secondary fa-4x mb-3"></i>
        <h4 class="fw-bold">Your cart is currently empty</h4>
        <p class="text-secondary">Explore our catalog and add your favorite items!</p>
        <a href="/products" class="btn btn-gradient mt-3">Start Shopping <i class="fas fa-arrow-right ms-2"></i></a>
    </div>

    <!-- Cart Summary & Items -->
    <div th:if="${!cart.items.empty}" class="row g-4">
        <!-- Cart Items Table -->
        <div class="col-lg-8">
            <div class="glass-panel p-4">
                <div class="table-responsive">
                    <table class="table table-dark table-hover align-middle bg-transparent">
                        <thead>
                            <tr class="border-secondary text-secondary">
                                <th>Product</th>
                                <th>Price</th>
                                <th>Quantity</th>
                                <th>Total</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="item : ${cart.items}">
                                <td>
                                    <div class="d-flex align-items-center gap-3">
                                        <img th:src="${item.productImage}" th:alt="${item.productName}" class="rounded" style="width: 50px; height: 50px; object-fit: cover;">
                                        <div>
                                            <a th:href="@{/products/{id}(id=${item.productId})}" class="text-decoration-none text-light fw-semibold" th:text="${item.productName}">Product</a>
                                        </div>
                                    </div>
                                </td>
                                <td th:text="'$' + ${item.price}">$0.00</td>
                                <td>
                                    <form th:action="@{/cart/update}" method="POST" class="d-flex align-items-center gap-1" style="max-width: 130px;">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                        <input type="hidden" name="cartItemId" th:value="${item.id}">
                                        <input type="number" name="quantity" class="form-control form-control-sm bg-transparent text-light border-secondary text-center" th:value="${item.quantity}" min="1" th:max="${item.availableStock}">
                                        <button type="submit" class="btn btn-sm btn-outline-secondary" title="Update"><i class="fas fa-sync-alt"></i></button>
                                    </form>
                                </td>
                                <td class="fw-bold text-primary" th:text="'$' + ${item.itemTotal}">$0.00</td>
                                <td>
                                    <form th:action="@{/cart/remove}" method="POST">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                        <input type="hidden" name="cartItemId" th:value="${item.id}">
                                        <button type="submit" class="btn btn-sm btn-outline-danger border-0"><i class="fas fa-trash-alt"></i></button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="d-flex justify-content-between align-items-center mt-3">
                    <a href="/products" class="btn btn-outline-light rounded-pill"><i class="fas fa-arrow-left me-2"></i> Continue Shopping</a>
                    <form th:action="@{/cart/clear}" method="POST">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="btn btn-outline-secondary rounded-pill btn-sm text-light"><i class="fas fa-trash me-2"></i> Clear Cart</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Order Summary Card -->
        <div class="col-lg-4">
            <div class="glass-panel p-4">
                <h5 class="fw-bold mb-4">Order Summary</h5>

                <div class="d-flex justify-content-between mb-2">
                    <span class="text-secondary">Subtotal</span>
                    <span class="fw-semibold" th:text="'$' + ${cart.subtotal}">$0.00</span>
                </div>
                <div class="d-flex justify-content-between mb-2">
                    <span class="text-secondary">Estimated Tax (8%)</span>
                    <span class="fw-semibold" th:text="'$' + ${cart.taxAmount}">$0.00</span>
                </div>
                <div class="d-flex justify-content-between mb-3">
                    <span class="text-secondary">Delivery Fee</span>
                    <span class="fw-semibold" th:text="'$' + ${cart.shippingFee}">$0.00</span>
                </div>

                <hr class="border-secondary opacity-25">

                <div class="d-flex justify-content-between mb-4 fs-5 fw-bold">
                    <span>Grand Total</span>
                    <span class="text-primary" th:text="'$' + ${cart.grandTotal}">$0.00</span>
                </div>

                <a href="/checkout" class="btn btn-gradient w-100 py-3 fw-bold">Proceed to Checkout <i class="fas fa-credit-card ms-2"></i></a>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
