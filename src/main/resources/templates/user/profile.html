<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | ApexCart</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="glass-panel p-4 p-md-5">
                <h3 class="fw-bold mb-4"><i class="fas fa-user-edit text-primary me-2"></i> Account Profile</h3>

                <div th:replace="~{fragments/alerts :: alerts}"></div>

                <form th:action="@{/profile}" th:object="${userProfileDto}" method="POST">
                    <div class="mb-3">
                        <label for="fullName" class="form-label text-secondary fw-semibold">Full Name *</label>
                        <input type="text" id="fullName" th:field="*{fullName}" class="form-control bg-transparent text-light border-secondary" required>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label text-secondary fw-semibold">Email Address (Read-Only)</label>
                        <input type="email" id="email" th:field="*{email}" class="form-control bg-transparent text-secondary border-secondary" readonly>
                    </div>

                    <div class="mb-3">
                        <label for="phone" class="form-label text-secondary fw-semibold">Phone Number</label>
                        <input type="text" id="phone" th:field="*{phone}" class="form-control bg-transparent text-light border-secondary">
                    </div>

                    <div class="mb-4">
                        <label for="address" class="form-label text-secondary fw-semibold">Default Shipping Address</label>
                        <textarea id="address" th:field="*{address}" class="form-control bg-transparent text-light border-secondary" rows="3"></textarea>
                    </div>

                    <button type="submit" class="btn btn-gradient px-4">Update Profile</button>
                </form>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
