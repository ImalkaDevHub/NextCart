<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Details | ApexCart</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold mb-0">Order <span class="text-primary" th:text="${order.orderNumber}">#ORD-123</span></h3>
        <div class="d-flex gap-2">
            <a th:href="@{/orders/{id}/invoice(id=${order.id})}" class="btn btn-outline-light rounded-pill"><i class="fas fa-print me-2"></i> Print Invoice</a>
            <a href="/orders" class="btn btn-outline-secondary rounded-pill">Back to Orders</a>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-lg-8">
            <div class="glass-panel p-4 mb-4">
                <h5 class="fw-bold mb-3">Purchased Items</h5>
                <div class="table-responsive">
                    <table class="table table-dark align-middle bg-transparent">
                        <thead>
                            <tr class="text-secondary border-secondary">
                                <th>Product</th>
                                <th>Price</th>
                                <th>Quantity</th>
                                <th>Subtotal</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="item : ${order.items}">
                                <td>
                                    <div class="d-flex align-items-center gap-3">
                                        <img th:src="${item.productImage}" th:alt="${item.productName}" class="rounded" style="width: 45px; height: 45px; object-fit: cover;">
                                        <span class="fw-semibold text-light" th:text="${item.productName}">Product</span>
                                    </div>
                                </td>
                                <td th:text="'$' + ${item.price}">$0.00</td>
                                <td th:text="${item.quantity}">1</td>
                                <td class="fw-bold text-primary" th:text="'$' + ${item.itemTotal}">$0.00</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="glass-panel p-4">
                <h5 class="fw-bold mb-3">Delivery Information</h5>
                <p class="text-secondary mb-1">Recipient: <strong class="text-light" th:text="${order.recipientName}">Name</strong></p>
                <p class="text-secondary mb-1">Phone: <span class="text-light" th:text="${order.recipientPhone}">Phone</span></p>
                <p class="text-secondary mb-4">Address: <span class="text-light" th:text="${order.shippingAddress}">Address</span></p>

                <hr class="border-secondary opacity-25">

                <div class="d-flex justify-content-between mb-2">
                    <span class="text-secondary">Subtotal</span>
                    <span th:text="'$' + ${order.subtotal}">$0.00</span>
                </div>
                <div class="d-flex justify-content-between mb-2">
                    <span class="text-secondary">Tax</span>
                    <span th:text="'$' + ${order.taxAmount}">$0.00</span>
                </div>
                <div class="d-flex justify-content-between mb-2">
                    <span class="text-secondary">Shipping Fee</span>
                    <span th:text="'$' + ${order.shippingFee}">$0.00</span>
                </div>
                <div class="d-flex justify-content-between fs-5 fw-bold text-primary mt-3">
                    <span>Total Paid</span>
                    <span th:text="'$' + ${order.totalAmount}">$0.00</span>
                </div>

                <!-- Order Cancellation option if pending/processing -->
                <div th:if="${order.orderStatus.name() == 'PENDING' || order.orderStatus.name() == 'PROCESSING'}" class="mt-4">
                    <form th:action="@{/orders/{id}/cancel(id=${order.id})}" method="POST">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="btn btn-outline-danger w-100" onclick="return confirm('Are you sure you want to cancel this order?')">
                            <i class="fas fa-times-circle me-1"></i> Cancel Order
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
