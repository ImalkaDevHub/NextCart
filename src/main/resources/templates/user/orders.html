<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders | ApexCart</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container my-5">
    <h3 class="fw-bold mb-4"><i class="fas fa-boxes text-primary me-2"></i> My Order History</h3>

    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <div th:if="${orders.empty}" class="glass-panel text-center p-5">
        <i class="fas fa-box-open text-secondary fa-4x mb-3"></i>
        <h5>You haven't placed any orders yet</h5>
        <a href="/products" class="btn btn-gradient mt-3">Start Shopping</a>
    </div>

    <div th:if="${!orders.empty}" class="glass-panel p-4">
        <div class="table-responsive">
            <table class="table table-dark table-hover align-middle bg-transparent">
                <thead>
                    <tr class="text-secondary border-secondary">
                        <th>Order #</th>
                        <th>Date</th>
                        <th>Status</th>
                        <th>Payment</th>
                        <th>Total</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="ord : ${orders}">
                        <td><strong class="text-light" th:text="${ord.orderNumber}">ORD-123</strong></td>
                        <td th:text="${#temporals.format(ord.orderDate, 'MMM dd, yyyy HH:mm')}">Date</td>
                        <td>
                            <span th:if="${ord.orderStatus.name() == 'PENDING'}" class="badge bg-warning text-dark">PENDING</span>
                            <span th:if="${ord.orderStatus.name() == 'PROCESSING'}" class="badge bg-info text-dark">PROCESSING</span>
                            <span th:if="${ord.orderStatus.name() == 'SHIPPED'}" class="badge bg-primary">SHIPPED</span>
                            <span th:if="${ord.orderStatus.name() == 'DELIVERED'}" class="badge bg-success">DELIVERED</span>
                            <span th:if="${ord.orderStatus.name() == 'CANCELLED'}" class="badge bg-danger">CANCELLED</span>
                        </td>
                        <td>
                            <span th:text="${ord.paymentMethod}">COD</span>
                            <small class="d-block text-secondary" th:text="${ord.paymentStatus}">PAID</small>
                        </td>
                        <td class="fw-bold text-primary" th:text="'$' + ${ord.totalAmount}">$0.00</td>
                        <td>
                            <div class="d-flex gap-2">
                                <a th:href="@{/orders/{id}(id=${ord.id})}" class="btn btn-sm btn-outline-light"><i class="fas fa-eye me-1"></i> View</a>
                                <a th:href="@{/orders/{id}/invoice(id=${ord.id})}" class="btn btn-sm btn-outline-secondary" title="Invoice"><i class="fas fa-file-invoice"></i></a>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
