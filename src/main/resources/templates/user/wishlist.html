<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Wishlist | ApexCart</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container my-5">
    <h3 class="fw-bold mb-4"><i class="fas fa-heart text-danger me-2"></i> My Wishlist</h3>

    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <div th:if="${wishlist.empty}" class="glass-panel text-center p-5">
        <i class="far fa-heart text-secondary fa-4x mb-3"></i>
        <h5>Your wishlist is empty</h5>
        <a href="/products" class="btn btn-gradient mt-3">Browse Products</a>
    </div>

    <div th:if="${!wishlist.empty}" class="row g-4">
        <div class="col-md-6 col-lg-3" th:each="prod : ${wishlist}">
            <div class="glass-card product-card h-100 d-flex flex-column justify-content-between overflow-hidden">
                <div class="position-relative">
                    <img th:src="${prod.image}" th:alt="${prod.productName}" class="w-100">
                </div>
                <div class="p-3 flex-grow-1 d-flex flex-column justify-content-between">
                    <div>
                        <small class="text-secondary" th:text="${prod.categoryName}">Category</small>
                        <h6 class="fw-bold text-truncate mb-1"><a th:href="@{/products/{id}(id=${prod.id})}" class="text-decoration-none text-light" th:text="${prod.productName}">Product</a></h6>
                        <span class="product-price" th:text="'$' + ${prod.price}">$0.00</span>
                    </div>

                    <div class="d-flex gap-2 mt-3">
                        <form th:action="@{/cart/add}" method="POST" class="flex-grow-1">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <input type="hidden" name="productId" th:value="${prod.id}">
                            <input type="hidden" name="quantity" value="1">
                            <button type="submit" class="btn btn-gradient btn-sm w-100"><i class="fas fa-shopping-cart me-1"></i> Add to Cart</button>
                        </form>

                        <form th:action="@{/wishlist/remove/{id}(id=${prod.id})}" method="POST">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn btn-sm btn-outline-danger" title="Remove"><i class="fas fa-trash"></i></button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
