<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmed | ApexCart</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="glass-panel p-5 text-center">
                <i class="fas fa-check-circle text-success fa-5x mb-3"></i>
                <h2 class="display-6 fw-bold mb-2">Order Successfully Placed!</h2>
                <p class="text-secondary lead mb-4">Thank you for your purchase. Your order reference is <span class="badge bg-primary fs-6" th:text="${order.orderNumber}">ORD-XXXX</span></p>

                <div class="glass-card p-4 text-start mb-4">
                    <h5 class="fw-bold mb-3 border-bottom border-secondary border-opacity-25 pb-2">Order Summary</h5>
                    <div class="row g-3">
                        <div class="col-sm-6">
                            <span class="text-secondary small">Recipient:</span><br>
                            <strong th:text="${order.recipientName}">Name</strong>
                        </div>
                        <div class="col-sm-6">
                            <span class="text-secondary small">Payment Method:</span><br>
                            <strong th:text="${order.paymentMethod}">COD</strong>
                        </div>
                        <div class="col-sm-6">
                            <span class="text-secondary small">Delivery Address:</span><br>
                            <span th:text="${order.shippingAddress}">Address</span>
                        </div>
                        <div class="col-sm-6">
                            <span class="text-secondary small">Total Paid / Due:</span><br>
                            <strong class="text-primary fs-5" th:text="'$' + ${order.totalAmount}">$0.00</strong>
                        </div>
                    </div>
                </div>

                <div class="d-flex justify-content-center gap-3">
                    <a th:href="@{/orders/{id}/invoice(id=${order.id})}" class="btn btn-outline-light rounded-pill px-4"><i class="fas fa-file-invoice me-2"></i> View Invoice</a>
                    <a href="/orders" class="btn btn-gradient px-4">My Orders <i class="fas fa-arrow-right ms-2"></i></a>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
