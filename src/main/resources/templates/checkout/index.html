<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | ApexCart</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container my-5">
    <h3 class="fw-bold mb-4"><i class="fas fa-cash-register text-success me-2"></i> Checkout</h3>

    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <form th:action="@{/checkout/process}" th:object="${checkoutDto}" method="POST">
        <div class="row g-4">
            <!-- Customer Shipping Info -->
            <div class="col-lg-7">
                <div class="glass-panel p-4 p-md-5 mb-4">
                    <h5 class="fw-bold mb-4"><i class="fas fa-truck text-primary me-2"></i> Shipping Details</h5>

                    <div class="mb-3">
                        <label for="recipientName" class="form-label text-secondary fw-semibold">Recipient Full Name *</label>
                        <input type="text" id="recipientName" th:field="*{recipientName}" class="form-control bg-transparent text-light border-secondary" required>
                        <small class="text-danger" th:if="${#fields.hasErrors('recipientName')}" th:errors="*{recipientName}"></small>
                    </div>

                    <div class="mb-3">
                        <label for="recipientPhone" class="form-label text-secondary fw-semibold">Phone Number *</label>
                        <input type="text" id="recipientPhone" th:field="*{recipientPhone}" class="form-control bg-transparent text-light border-secondary" required>
                        <small class="text-danger" th:if="${#fields.hasErrors('recipientPhone')}" th:errors="*{recipientPhone}"></small>
                    </div>

                    <div class="mb-3">
                        <label for="shippingAddress" class="form-label text-secondary fw-semibold">Complete Delivery Address *</label>
                        <textarea id="shippingAddress" th:field="*{shippingAddress}" class="form-control bg-transparent text-light border-secondary" rows="3" required></textarea>
                        <small class="text-danger" th:if="${#fields.hasErrors('shippingAddress')}" th:errors="*{shippingAddress}"></small>
                    </div>
                </div>

                <!-- Payment Selection -->
                <div class="glass-panel p-4 p-md-5">
                    <h5 class="fw-bold mb-4"><i class="fas fa-wallet text-warning me-2"></i> Payment Method Simulation</h5>

                    <div class="form-check glass-card p-3 mb-3">
                        <input class="form-check-input ms-1" type="radio" th:field="*{paymentMethod}" id="pmCod" value="COD">
                        <label class="form-check-label fw-bold text-light ms-2" for="pmCod">
                            <i class="fas fa-hand-holding-usd text-success me-2"></i> Cash on Delivery (COD)
                        </label>
                    </div>

                    <div class="form-check glass-card p-3 mb-3">
                        <input class="form-check-input ms-1" type="radio" th:field="*{paymentMethod}" id="pmCard" value="CREDIT_CARD">
                        <label class="form-check-label fw-bold text-light ms-2" for="pmCard">
                            <i class="fas fa-credit-card text-primary me-2"></i> Credit / Debit Card (Simulation)
                        </label>
                    </div>

                    <div class="form-check glass-card p-3 mb-3">
                        <input class="form-check-input ms-1" type="radio" th:field="*{paymentMethod}" id="pmUpi" value="UPI">
                        <label class="form-check-label fw-bold text-light ms-2" for="pmUpi">
                            <i class="fas fa-mobile-alt text-warning me-2"></i> Instant UPI / QR Code (Simulation)
                        </label>
                    </div>

                    <!-- Payment Simulation Error Switch for Testing -->
                    <div class="form-check form-switch mt-4 p-3 glass-card bg-danger bg-opacity-10">
                        <input class="form-check-input ms-1" type="checkbox" th:field="*{simulateFailure}" id="simulateFailure">
                        <label class="form-check-label text-warning fw-semibold ms-2" for="simulateFailure">
                            <i class="fas fa-vial me-1"></i> Simulate Payment Failure (For Evaluation Testing)
                        </label>
                    </div>
                </div>
            </div>

            <!-- Order Review Sidebar -->
            <div class="col-lg-5">
                <div class="glass-panel p-4 p-md-5">
                    <h5 class="fw-bold mb-4">Order Items (<span th:text="${cart.totalItems}">0</span>)</h5>

                    <div th:each="item : ${cart.items}" class="d-flex align-items-center gap-3 mb-3 pb-3 border-bottom border-secondary border-opacity-25">
                        <img th:src="${item.productImage}" th:alt="${item.productName}" class="rounded" style="width: 50px; height: 50px; object-fit: cover;">
                        <div class="flex-grow-1">
                            <h6 class="fw-semibold mb-0 text-light text-truncate" style="max-width: 200px;" th:text="${item.productName}">Product</h6>
                            <small class="text-secondary" th:text="${item.quantity} + ' x $' + ${item.price}">1 x $0</small>
                        </div>
                        <span class="fw-bold text-primary" th:text="'$' + ${item.itemTotal}">$0.00</span>
                    </div>

                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-secondary">Subtotal</span>
                        <span class="fw-semibold" th:text="'$' + ${cart.subtotal}">$0.00</span>
                    </div>
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-secondary">Tax (8%)</span>
                        <span class="fw-semibold" th:text="'$' + ${cart.taxAmount}">$0.00</span>
                    </div>
                    <div class="d-flex justify-content-between mb-3">
                        <span class="text-secondary">Delivery Fee</span>
                        <span class="fw-semibold" th:text="'$' + ${cart.shippingFee}">$0.00</span>
                    </div>

                    <hr class="border-secondary opacity-25">

                    <div class="d-flex justify-content-between mb-4 fs-4 fw-bold">
                        <span>Total Due</span>
                        <span class="text-primary" th:text="'$' + ${cart.grandTotal}">$0.00</span>
                    </div>

                    <button type="submit" class="btn btn-gradient btn-lg w-100 py-3 fw-bold">Place Order & Pay <i class="fas fa-lock ms-2"></i></button>
                </div>
            </div>
        </div>
    </form>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
