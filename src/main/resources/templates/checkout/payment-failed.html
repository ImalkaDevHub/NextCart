<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Failed | ApexCart</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="glass-panel p-5 text-center">
                <i class="fas fa-exclamation-triangle text-danger fa-5x mb-3"></i>
                <h2 class="display-6 fw-bold mb-2">Payment Simulation Failed</h2>
                <p class="text-secondary lead mb-4">Your payment transaction was declined by the simulated gateway for order <span class="badge bg-danger" th:text="${order.orderNumber}">ORD-XXXX</span></p>

                <div class="alert alert-warning glass-card text-start mb-4">
                    <i class="fas fa-info-circle me-2"></i> No funds were charged. You can retry payment with another payment method such as Cash on Delivery.
                </div>

                <div class="d-flex justify-content-center gap-3">
                    <a href="/checkout" class="btn btn-gradient px-4"><i class="fas fa-redo me-2"></i> Retry Payment</a>
                    <a href="/cart" class="btn btn-outline-light rounded-pill px-4">Return to Cart</a>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
