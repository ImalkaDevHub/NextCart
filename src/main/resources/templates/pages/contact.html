<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | NextCart</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="glass-panel p-4 p-md-5">
                <h3 class="fw-bold mb-3"><i class="fas fa-envelope text-primary me-2"></i> Contact Customer Support</h3>
                <p class="text-secondary mb-4">Have questions about an order or product? Send us a message below.</p>

                <form action="#" method="POST" onsubmit="alert('Thank you! Your message has been received.'); return false;">
                    <div class="mb-3">
                        <label class="form-label text-secondary fw-semibold">Your Name</label>
                        <input type="text" class="form-control bg-transparent text-light border-secondary" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-secondary fw-semibold">Email Address</label>
                        <input type="email" class="form-control bg-transparent text-light border-secondary" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-secondary fw-semibold">Message</label>
                        <textarea class="form-control bg-transparent text-light border-secondary" rows="4" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-gradient px-4">Send Message</button>
                </form>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
