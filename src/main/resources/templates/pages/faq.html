<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frequently Asked Questions | NextCart</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container my-5">
    <div class="glass-panel p-4 p-md-5">
        <h3 class="fw-bold mb-4"><i class="fas fa-question-circle text-primary me-2"></i> Frequently Asked Questions</h3>

        <div class="accordion accordion-flush" id="faqAccordion">
            <div class="accordion-item glass-card mb-3">
                <h2 class="accordion-header" id="headingOne">
                    <button class="accordion-button collapsed bg-transparent text-light fw-semibold" type="button" data-bs-toggle="collapse" data-bs-target="#collapseOne">
                        How does payment simulation work?
                    </button>
                </h2>
                <div id="collapseOne" class="accordion-collapse collapse" data-bs-parent="#faqAccordion">
                    <div class="accordion-body text-secondary">
                        During checkout, you can select Cash on Delivery, Credit Card, or UPI simulation. You can also toggle the "Simulate Payment Failure" switch to test error handling logic!
                    </div>
                </div>
            </div>

            <div class="accordion-item glass-card mb-3">
                <h2 class="accordion-header" id="headingTwo">
                    <button class="accordion-button collapsed bg-transparent text-light fw-semibold" type="button" data-bs-toggle="collapse" data-bs-target="#collapseTwo">
                        What are the default login credentials?
                    </button>
                </h2>
                <div id="collapseTwo" class="accordion-collapse collapse" data-bs-parent="#faqAccordion">
                    <div class="accordion-body text-secondary">
                        - <strong>Admin:</strong> admin@ecommerce.com / admin123<br>
                        - <strong>Customer:</strong> john@example.com / user123
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
