<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}"/>
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}"/>
    <title>Product Catalog | ApexCart</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container my-4">
    <div class="row g-4">
        <!-- Sidebar Filter Form -->
        <div class="col-lg-3">
            <div class="glass-panel p-4">
                <h5 class="fw-bold mb-3"><i class="fas fa-filter text-primary me-2"></i> Filters</h5>
                <form action="/products" method="GET">
                    <!-- Search Keyword -->
                    <div class="mb-3">
                        <label class="form-label text-secondary small fw-semibold">Keyword Search</label>
                        <input type="text" name="keyword" class="form-control bg-transparent text-light border-secondary" placeholder="Search..." th:value="${filter.keyword}">
                    </div>

                    <!-- Category Filter -->
                    <div class="mb-3">
                        <label class="form-label text-secondary small fw-semibold">Category</label>
                        <select name="categoryId" class="form-select bg-transparent text-light border-secondary">
                            <option value="" class="bg-dark text-light">All Categories</option>
                            <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.categoryName}" th:selected="${filter.categoryId == cat.id}" class="bg-dark text-light"></option>
                        </select>
                    </div>

                    <!-- Brand Filter -->
                    <div class="mb-3">
                        <label class="form-label text-secondary small fw-semibold">Brand</label>
                        <select name="brand" class="form-select bg-transparent text-light border-secondary">
                            <option value="" class="bg-dark text-light">All Brands</option>
                            <option th:each="b : ${brands}" th:value="${b}" th:text="${b}" th:selected="${filter.brand == b}" class="bg-dark text-light"></option>
                        </select>
                    </div>

                    <!-- Price Range -->
                    <div class="mb-3">
                        <label class="form-label text-secondary small fw-semibold">Price Range ($)</label>
                        <div class="d-flex gap-2">
                            <input type="number" step="0.01" name="minPrice" class="form-control bg-transparent text-light border-secondary" placeholder="Min" th:value="${filter.minPrice}">
                            <input type="number" step="0.01" name="maxPrice" class="form-control bg-transparent text-light border-secondary" placeholder="Max" th:value="${filter.maxPrice}">
                        </div>
                    </div>

                    <!-- Sort Option -->
                    <div class="mb-4">
                        <label class="form-label text-secondary small fw-semibold">Sort By</label>
                        <select name="sortBy" class="form-select bg-transparent text-light border-secondary">
                            <option value="newest" th:selected="${filter.sortBy == 'newest'}" class="bg-dark text-light">Newest Arrivals</option>
                            <option value="price_low" th:selected="${filter.sortBy == 'price_low'}" class="bg-dark text-light">Price: Low to High</option>
                            <option value="price_high" th:selected="${filter.sortBy == 'price_high'}" class="bg-dark text-light">Price: High to Low</option>
                            <option value="popular" th:selected="${filter.sortBy == 'popular'}" class="bg-dark text-light">Popular / Featured</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-gradient w-100 mb-2">Apply Filters</button>
                    <a href="/products" class="btn btn-outline-secondary btn-sm w-100 text-light">Reset All</a>
                </form>
            </div>
        </div>

        <!-- Products Grid Area -->
        <div class="col-lg-9">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h4 class="fw-bold mb-0">Catalog Products</h4>
                    <small class="text-secondary" th:text="'Showing ' + ${productPage.totalElements} + ' item(s)'"></small>
                </div>
            </div>

            <!-- Empty State -->
            <div th:if="${productPage.totalElements == 0}" class="glass-panel text-center p-5 my-4">
                <i class="fas fa-box-open text-secondary fa-4x mb-3"></i>
                <h5>No Products Match Your Criteria</h5>
                <p class="text-secondary small">Try clearing some filter fields or search terms.</p>
                <a href="/products" class="btn btn-gradient">Reset Filters</a>
            </div>

            <!-- Product Cards Grid -->
            <div class="row g-4" th:if="${productPage.totalElements > 0}">
                <div class="col-md-6 col-lg-4" th:each="prod : ${productPage.content}">
                    <div class="glass-card product-card h-100 d-flex flex-column justify-content-between overflow-hidden">
                        <div class="position-relative">
                            <img th:src="${prod.image}" th:alt="${prod.productName}" class="w-100">
                            <button class="btn btn-sm btn-light rounded-circle position-absolute top-0 end-0 m-3 btn-wishlist-toggle" th:data-product-id="${prod.id}" title="Add to Wishlist">
                                <i class="far fa-heart text-dark"></i>
                            </button>
                        </div>
                        <div class="p-3 flex-grow-1 d-flex flex-column justify-content-between">
                            <div>
                                <small class="text-secondary" th:text="${prod.categoryName}">Category</small>
                                <h6 class="fw-bold text-truncate mb-1"><a th:href="@{/products/{id}(id=${prod.id})}" class="text-decoration-none text-light" th:text="${prod.productName}">Product Name</a></h6>
                                <div class="d-flex align-items-center gap-1 mb-2 rating-stars">
                                    <i class="fas fa-star text-warning"></i>
                                    <span class="small fw-semibold text-light" th:text="${prod.averageRating}">5.0</span>
                                    <span class="small text-secondary" th:text="'(' + ${prod.reviewCount} + ')'">(0)</span>
                                </div>
                            </div>
                            <div class="d-flex align-items-center justify-content-between mt-3">
                                <span class="product-price" th:text="'$' + ${prod.price}">$0.00</span>
                                <button class="btn btn-gradient btn-sm btn-add-cart-ajax" th:data-product-id="${prod.id}">
                                    <i class="fas fa-cart-plus me-1"></i> Add
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Pagination Controls -->
            <nav th:if="${productPage.totalPages > 1}" class="my-4">
                <ul class="pagination justify-content-center gap-1">
                    <li class="page-item" th:classappend="${productPage.first} ? 'disabled'">
                        <a class="page-link bg-transparent text-light border-secondary" th:href="@{/products(page=${productPage.number - 1}, keyword=${filter.keyword}, categoryId=${filter.categoryId}, brand=${filter.brand}, minPrice=${filter.minPrice}, maxPrice=${filter.maxPrice}, sortBy=${filter.sortBy})}">Previous</a>
                    </li>
                    <li class="page-item" th:each="i : ${#numbers.sequence(0, productPage.totalPages - 1)}" th:classappend="${i == productPage.number} ? 'active'">
                        <a class="page-link" th:classappend="${i == productPage.number} ? 'btn-gradient text-white' : 'bg-transparent text-light border-secondary'" th:href="@{/products(page=${i}, keyword=${filter.keyword}, categoryId=${filter.categoryId}, brand=${filter.brand}, minPrice=${filter.minPrice}, maxPrice=${filter.maxPrice}, sortBy=${filter.sortBy})}" th:text="${i + 1}">1</a>
                    </li>
                    <li class="page-item" th:classappend="${productPage.last} ? 'disabled'">
                        <a class="page-link bg-transparent text-light border-secondary" th:href="@{/products(page=${productPage.number + 1}, keyword=${filter.keyword}, categoryId=${filter.categoryId}, brand=${filter.brand}, minPrice=${filter.minPrice}, maxPrice=${filter.maxPrice}, sortBy=${filter.sortBy})}">Next</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
