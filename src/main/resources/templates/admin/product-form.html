<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Form | Admin ApexCart</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="glass-panel p-4 p-md-5">
                <h4 class="fw-bold mb-4" th:text="${productDto.id != null ? 'Edit Product' : 'Create Product'}">Product Form</h4>

                <form th:action="@{/admin/products/save}" th:object="${productDto}" method="POST" enctype="multipart/form-data">
                    <input type="hidden" th:field="*{id}">

                    <div class="row g-3 mb-3">
                        <div class="col-md-8">
                            <label for="productName" class="form-label text-secondary fw-semibold">Product Name *</label>
                            <input type="text" id="productName" th:field="*{productName}" class="form-control bg-transparent text-light border-secondary" required>
                        </div>
                        <div class="col-md-4">
                            <label for="brand" class="form-label text-secondary fw-semibold">Brand</label>
                            <input type="text" id="brand" th:field="*{brand}" class="form-control bg-transparent text-light border-secondary" placeholder="e.g. Sony, Samsung">
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-4">
                            <label for="categoryId" class="form-label text-secondary fw-semibold">Category *</label>
                            <select id="categoryId" th:field="*{categoryId}" class="form-select bg-transparent text-light border-secondary" required>
                                <option value="" class="bg-dark">Select Category</option>
                                <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.categoryName}" class="bg-dark"></option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label for="price" class="form-label text-secondary fw-semibold">Price ($) *</label>
                            <input type="number" step="0.01" id="price" th:field="*{price}" class="form-control bg-transparent text-light border-secondary" required>
                        </div>
                        <div class="col-md-4">
                            <label for="stock" class="form-label text-secondary fw-semibold">Stock Quantity *</label>
                            <input type="number" id="stock" th:field="*{stock}" class="form-control bg-transparent text-light border-secondary" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="description" class="form-label text-secondary fw-semibold">Description</label>
                        <textarea id="description" th:field="*{description}" class="form-control bg-transparent text-light border-secondary" rows="3"></textarea>
                    </div>

                    <div class="mb-3">
                        <label for="specifications" class="form-label text-secondary fw-semibold">Technical Specifications</label>
                        <textarea id="specifications" th:field="*{specifications}" class="form-control bg-transparent text-light border-secondary" rows="2" placeholder="e.g. Bluetooth 5.2, USB-C, 40hr Battery"></textarea>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label for="image" class="form-label text-secondary fw-semibold">Product Image URL</label>
                            <input type="text" id="image" th:field="*{image}" class="form-control bg-transparent text-light border-secondary" placeholder="https://images.unsplash.com/...">
                        </div>
                        <div class="col-md-6">
                            <label for="imageFile" class="form-label text-secondary fw-semibold">Or Upload Local Image File</label>
                            <input type="file" id="imageFile" th:field="*{imageFile}" class="form-control bg-transparent text-light border-secondary" accept="image/*">
                        </div>
                    </div>

                    <div class="form-check mb-4">
                        <input class="form-check-input" type="checkbox" id="isFeatured" th:field="*{isFeatured}">
                        <label class="form-check-label text-light fw-semibold" for="isFeatured">
                            Mark as Featured Product (Displayed in Home Banner Grid)
                        </label>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-gradient px-4">Save Product</button>
                        <a href="/admin/products" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
