<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Customers | Admin NextCart</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container my-5">
    <h3 class="fw-bold mb-4"><i class="fas fa-users text-primary me-2"></i> Manage Customers</h3>

    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <div class="glass-panel p-4">
        <div class="table-responsive">
            <table class="table table-dark table-hover align-middle bg-transparent">
                <thead>
                    <tr class="text-secondary border-secondary">
                        <th>ID</th>
                        <th>Full Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Status</th>
                        <th>Joined Date</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="c : ${customers}">
                        <td th:text="${c.id}">1</td>
                        <td class="fw-semibold text-light" th:text="${c.fullName}">Customer Name</td>
                        <td th:text="${c.email}">Email</td>
                        <td th:text="${c.phone != null ? c.phone : 'N/A'}">Phone</td>
                        <td>
                            <span th:if="${c.enabled}" class="badge bg-success">ACTIVE</span>
                            <span th:if="${!c.enabled}" class="badge bg-danger">DISABLED</span>
                        </td>
                        <td th:text="${#temporals.format(c.createdAt, 'MMM dd, yyyy')}">Date</td>
                        <td>
                            <form th:action="@{/admin/customers/toggle-status/{id}(id=${c.id})}" method="POST">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button type="submit" th:classappend="${c.enabled} ? 'btn-outline-danger' : 'btn-outline-success'" class="btn btn-sm">
                                    <i th:classappend="${c.enabled} ? 'fa-user-slash' : 'fa-user-check'" class="fas me-1"></i>
                                    <span th:text="${c.enabled ? 'Disable' : 'Enable'}">Toggle</span>
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
