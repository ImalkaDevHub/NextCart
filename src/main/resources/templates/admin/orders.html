<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Orders | Admin NextCart</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container my-5">
    <h3 class="fw-bold mb-4"><i class="fas fa-shopping-bag text-primary me-2"></i> Manage Customer Orders</h3>

    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <div class="glass-panel p-4">
        <div class="table-responsive">
            <table class="table table-dark table-hover align-middle bg-transparent">
                <thead>
                    <tr class="text-secondary border-secondary">
                        <th>Order #</th>
                        <th>Customer</th>
                        <th>Date</th>
                        <th>Payment</th>
                        <th>Total</th>
                        <th>Order Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="ord : ${orders}">
                        <td><strong class="text-light" th:text="${ord.orderNumber}">ORD-123</strong></td>
                        <td>
                            <span class="fw-semibold text-light" th:text="${ord.userFullName}">Name</span>
                            <small class="d-block text-secondary" th:text="${ord.userEmail}">Email</small>
                        </td>
                        <td th:text="${#temporals.format(ord.orderDate, 'MMM dd, HH:mm')}">Date</td>
                        <td>
                            <span th:text="${ord.paymentMethod}">COD</span>
                            <small class="d-block text-secondary" th:text="${ord.paymentStatus}">PAID</small>
                        </td>
                        <td class="fw-bold text-primary" th:text="'$' + ${ord.totalAmount}">$0.00</td>
                        <td>
                            <form th:action="@{/admin/orders/{id}/status(id=${ord.id})}" method="POST" class="d-flex align-items-center gap-1">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <select name="status" class="form-select form-select-sm bg-transparent text-light border-secondary">
                                    <option th:each="st : ${statuses}" th:value="${st}" th:text="${st}" th:selected="${ord.orderStatus == st}" class="bg-dark"></option>
                                </select>
                                <button type="submit" class="btn btn-sm btn-outline-success" title="Update"><i class="fas fa-check"></i></button>
                            </form>
                        </td>
                        <td>
                            <a th:href="@{/admin/orders/{id}(id=${ord.id})}" class="btn btn-sm btn-outline-light"><i class="fas fa-eye"></i> Detail</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
