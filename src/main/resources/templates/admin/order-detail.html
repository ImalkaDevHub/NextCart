<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Order Detail | ApexCart</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold mb-0">Admin View: Order <span class="text-primary" th:text="${order.orderNumber}">#ORD-123</span></h3>
        <a href="/admin/orders" class="btn btn-outline-secondary rounded-pill">Back to Orders</a>
    </div>

    <div class="row g-4">
        <div class="col-lg-8">
            <div class="glass-panel p-4 mb-4">
                <h5 class="fw-bold mb-3">Order Items</h5>
                <div class="table-responsive">
                    <table class="table table-dark align-middle bg-transparent">
                        <thead>
                            <tr class="text-secondary border-secondary">
                                <th>Product</th>
                                <th>Unit Price</th>
                                <th>Quantity</th>
                                <th>Subtotal</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="item : ${order.items}">
                                <td>
                                    <div class="d-flex align-items-center gap-3">
                                        <img th:src="${item.productImage}" class="rounded" style="width: 45px; height: 45px; object-fit: cover;">
                                        <span class="fw-semibold text-light" th:text="${item.productName}">Product</span>
                                    </div>
                                </td>
                                <td th:text="'$' + ${item.price}">$0.00</td>
                                <td th:text="${item.quantity}">1</td>
                                <td class="fw-bold text-primary" th:text="'$' + ${item.itemTotal}">$0.00</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="glass-panel p-4">
                <h5 class="fw-bold mb-3">Customer & Delivery Info</h5>
                <p class="text-secondary mb-1">Customer: <strong class="text-light" th:text="${order.userFullName}">Name</strong></p>
                <p class="text-secondary mb-1">Email: <span class="text-light" th:text="${order.userEmail}">Email</span></p>
                <p class="text-secondary mb-1">Phone: <span class="text-light" th:text="${order.recipientPhone}">Phone</span></p>
                <p class="text-secondary mb-4">Address: <span class="text-light" th:text="${order.shippingAddress}">Address</span></p>

                <hr class="border-secondary opacity-25">

                <h6 class="fw-bold mb-3">Update Order Status</h6>
                <form th:action="@{/admin/orders/{id}/status(id=${order.id})}" method="POST">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <select name="status" class="form-select bg-transparent text-light border-secondary mb-3">
                        <option th:each="st : ${statuses}" th:value="${st}" th:text="${st}" th:selected="${order.orderStatus == st}" class="bg-dark"></option>
                    </select>
                    <button type="submit" class="btn btn-gradient w-100">Update Status</button>
                </form>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
