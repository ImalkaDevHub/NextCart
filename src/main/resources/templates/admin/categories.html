<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Categories | Admin ApexCart</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold mb-0"><i class="fas fa-tags text-primary me-2"></i> Manage Categories</h3>
        <a href="/admin/categories/new" class="btn btn-gradient"><i class="fas fa-plus me-1"></i> Add Category</a>
    </div>

    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <div class="glass-panel p-4">
        <div class="table-responsive">
            <table class="table table-dark table-hover align-middle bg-transparent">
                <thead>
                    <tr class="text-secondary border-secondary">
                        <th>ID</th>
                        <th>Category Name</th>
                        <th>Description</th>
                        <th>Product Count</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="cat : ${categories}">
                        <td th:text="${cat.id}">1</td>
                        <td>
                            <div class="d-flex align-items-center gap-3">
                                <img th:src="${cat.imageUrl}" class="rounded" style="width: 40px; height: 40px; object-fit: cover;">
                                <strong class="text-light" th:text="${cat.categoryName}">Name</strong>
                            </div>
                        </td>
                        <td th:text="${cat.description}">Description</td>
                        <td><span class="badge bg-primary rounded-pill px-3" th:text="${cat.productCount}">0</span></td>
                        <td>
                            <div class="d-flex gap-2">
                                <a th:href="@{/admin/categories/edit/{id}(id=${cat.id})}" class="btn btn-sm btn-outline-warning"><i class="fas fa-edit"></i> Edit</a>
                                <a th:href="@{/admin/categories/delete/{id}(id=${cat.id})}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Delete category?')"><i class="fas fa-trash"></i> Delete</a>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
