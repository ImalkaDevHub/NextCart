<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Products | Admin ApexCart</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold mb-0"><i class="fas fa-boxes text-primary me-2"></i> Manage Products</h3>
        <div class="d-flex gap-2">
            <a href="/admin/reports/products/excel" class="btn btn-success"><i class="fas fa-file-excel me-1"></i> Export Excel</a>
            <a href="/admin/products/new" class="btn btn-gradient"><i class="fas fa-plus me-1"></i> Add Product</a>
        </div>
    </div>

    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <div class="glass-panel p-4">
        <div class="table-responsive">
            <table class="table table-dark table-hover align-middle bg-transparent">
                <thead>
                    <tr class="text-secondary border-secondary">
                        <th>Image</th>
                        <th>Product Name</th>
                        <th>Category</th>
                        <th>Price</th>
                        <th>Stock</th>
                        <th>Featured</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="prod : ${products}">
                        <td><img th:src="${prod.image}" class="rounded" style="width: 45px; height: 45px; object-fit: cover;"></td>
                        <td>
                            <strong class="text-light" th:text="${prod.productName}">Name</strong>
                            <small class="d-block text-secondary" th:text="${prod.brand}">Brand</small>
                        </td>
                        <td th:text="${prod.categoryName}">Category</td>
                        <td class="fw-bold text-primary" th:text="'$' + ${prod.price}">$0.00</td>
                        <td>
                            <span th:classappend="${prod.stock <= 5} ? 'badge bg-danger' : 'badge bg-success'" th:text="${prod.stock}">0</span>
                        </td>
                        <td>
                            <span th:if="${prod.isFeatured}" class="badge bg-warning text-dark">YES</span>
                            <span th:if="${!prod.isFeatured}" class="badge bg-secondary">NO</span>
                        </td>
                        <td>
                            <div class="d-flex gap-2">
                                <a th:href="@{/admin/products/edit/{id}(id=${prod.id})}" class="btn btn-sm btn-outline-warning"><i class="fas fa-edit"></i> Edit</a>
                                <a th:href="@{/admin/products/delete/{id}(id=${prod.id})}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Delete product?')"><i class="fas fa-trash"></i> Delete</a>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
