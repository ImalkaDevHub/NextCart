<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Category Form | Admin NextCart</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="glass-panel p-4 p-md-5">
                <h4 class="fw-bold mb-4" th:text="${categoryDto.id != null ? 'Edit Category' : 'Create Category'}">Category Form</h4>

                <form th:action="@{/admin/categories/save}" th:object="${categoryDto}" method="POST">
                    <input type="hidden" th:field="*{id}">

                    <div class="mb-3">
                        <label for="categoryName" class="form-label text-secondary fw-semibold">Category Name *</label>
                        <input type="text" id="categoryName" th:field="*{categoryName}" class="form-control bg-transparent text-light border-secondary" required>
                    </div>

                    <div class="mb-3">
                        <label for="description" class="form-label text-secondary fw-semibold">Description</label>
                        <textarea id="description" th:field="*{description}" class="form-control bg-transparent text-light border-secondary" rows="3"></textarea>
                    </div>

                    <div class="mb-4">
                        <label for="imageUrl" class="form-label text-secondary fw-semibold">Category Image URL</label>
                        <input type="url" id="imageUrl" th:field="*{imageUrl}" class="form-control bg-transparent text-light border-secondary" placeholder="https://images.unsplash.com/...">
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-gradient px-4">Save Category</button>
                        <a href="/admin/categories" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
